<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#142c54" />
      <stop offset="100%" stop-color="#0a1224" />
    </radialGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005c8a" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#90e0ef" />
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#03045e" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Sparkle/Glow Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow for Text/Mark -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="40" fill="url(#bgGrad)" />

  <!-- DECORATIVE BACKGROUND ELEMENTS (Digital Network / Barcode Patterns) -->
  <g opacity="0.15" stroke="#00b4d8" stroke-width="1" fill="none">
    <circle cx="400" cy="400" r="320" stroke-dasharray="5,5" />
    <circle cx="400" cy="400" r="240" stroke-dasharray="2,8" />
    <line x1="150" y1="200" x2="280" y2="200" />
    <line x1="280" y1="200" x2="350" y2="270" />
    <circle cx="150" cy="200" r="3" fill="#00b4d8" />
    <circle cx="280" cy="200" r="3" fill="#00b4d8" />
    
    <line x1="650" y1="220" x2="520" y2="220" stroke-width="1.5" />
    <line x1="520" y1="220" x2="480" y2="260" stroke-width="1.5" />
    <circle cx="650" cy="220" r="4" fill="#00b4d8" />
    <circle cx="520" cy="220" r="4" fill="#00b4d8" />
  </g>

  <!-- SVG BRAND ICON (The V + Transaction/Electricity Loop) -->
  <g filter="url(#shadow)" transform="translate(160, 110)">
    <!-- Tech node background grids -->
    <g opacity="0.3">
      <line x1="170" y1="60" x2="250" y2="60" stroke="#00b4d8" stroke-width="2" />
      <line x1="250" y1="60" x2="250" y2="140" stroke="#00b4d8" stroke-width="2" stroke-dasharray="4,4" />
      <circle cx="170" cy="60" r="4" fill="#00b4d8" />
      <circle cx="250" cy="60" r="4" fill="#00b4d8" />
      <circle cx="250" cy="140" r="4" fill="#00b4d8" />
    </g>

    <!-- Abstract Barcode Base Detail inside the V -->
    <g transform="translate(195, 175)" fill="#0077b6" opacity="0.6">
      <rect x="0" y="0" width="3" height="30" />
      <rect x="6" y="0" width="2" height="30" />
      <rect x="11" y="0" width="5" height="30" />
      <rect x="19" y="0" width="1" height="30" />
      <rect x="23" y="0" width="4" height="30" />
      <rect x="30" y="0" width="2" height="30" />
    </g>

    <!-- LEFT STROKE: Sleek solid & dimensional "V" wing -->
    <path d="M 12 55 L 75 55 L 175 295 L 115 295 Z" fill="url(#cyanGrad)" />
    <!-- Highlight overlay on left wing -->
    <path d="M 12 55 L 45 55 L 140 295 L 115 295 Z" fill="#ffffff" opacity="0.15" />

    <!-- RIGHT STROKE: Tech-Lightning Bolt transforming into digital grid -->
    <path d="M 335 52 L 235 295 L 165 295 L 265 52 Z" fill="url(#blueGrad)" />

    <!-- INTERACTIVE SWEEP: Lightning, Transaction speed & Growth "V/Bolt" loop -->
    <path d="M 28 200 C 12 110, 150 70, 245 138 C 295 174, 375 80, 422 62 C 430 59, 435 70, 428 78 C 380 135, 305 240, 245 250 C 130 268, 44 280, 28 200 Z" fill="url(#cyanGrad)" filter="url(#glow)" />
    <!-- Interactive Glowing Node on tip -->
    <circle cx="418" cy="63" r="18" fill="#90e0ef" filter="url(#glow)" />
    <circle cx="418" cy="63" r="8" fill="#ffffff" />

    <!-- Additional Dynamic sparkles/Nodes -->
    <circle cx="5" cy="180" r="3" fill="#90e0ef" opacity="0.8" />
    <circle cx="42" cy="115" r="4" fill="#ffffff" opacity="0.9" />
    <circle cx="340" cy="150" r="3" fill="#90e0ef" opacity="0.7" />
    <circle cx="395" cy="130" r="2.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- BRAND NAME: Volta -->
  <g filter="url(#shadow)" transform="translate(400, 530)">
    <text x="0" y="0" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="120px" fill="#ffffff" text-anchor="middle" letter-spacing="-1px">
      Volta
    </text>
    <!-- Cyan gradient touch on the bottom or edge of V to create custom typeface vibe -->
    <text x="0" y="0" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="120px" fill="url(#cyanGrad)" text-anchor="middle" letter-spacing="-1px" clip-path="polygon(0 0, 120 0, 140 120, 0 120)" transform="translate(-155, 0)" opacity="0.9">
      V
    </text>
  </g>

  <!-- SUBTITLE: SmartPOS -->
  <text x="400" y="615" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="42px" fill="#00b4d8" text-anchor="middle" letter-spacing="4px">
    SmartPOS
  </text>

  <!-- TAGLINE: Powering Everyday Sales -->
  <text x="400" y="665" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="20px" fill="#90e0ef" text-anchor="middle" letter-spacing="5px" opacity="0.85">
    POWERING EVERYDAY SALES
  </text>

  <!-- Subtle grid interface aesthetics below tagline -->
  <g opacity="0.3" stroke="#00b4d8" stroke-width="1.5" fill="none">
    <line x1="280" y1="710" x2="520" y2="710" />
    <circle cx="280" cy="710" r="2.5" fill="#00b4d8" />
    <circle cx="520" cy="710" r="2.5" fill="#00b4d8" />
    <circle cx="400" cy="710" r="4" fill="#00b4d8" />
  </g>
</svg>